name: CI

# Pushes to main are built (and type-checked) by the deploy workflow,
# so CI only needs to check pull requests before they're merged.
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check and build
        run: npm run build
